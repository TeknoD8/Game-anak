<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4dabf7">
<title>Balap Sepeda Berhitung – Main & Belajar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%}
  body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(180deg,#d0ebff 0%,#d3f9d8 100%);color:#2b2d42;overflow-x:hidden;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:16px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-size:clamp(26px,6vw,40px);margin:4px 0;line-height:1.1}
  .badge{background:#20c997;color:#fff;border-radius:999px;padding:4px 14px;font-size:18px;font-weight:800}
  .stars{font-size:26px;font-weight:800;background:#fff;border-radius:999px;padding:4px 14px;box-shadow:0 4px 0 #e0c97a;white-space:nowrap}
  .menu{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .tile{border:none;border-radius:28px;padding:18px 8px;font-family:inherit;font-size:24px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tile:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .tile .ico{font-size:58px;line-height:1}
  .tile small{font-size:15px;font-weight:600;opacity:.9}
  .t1{background:#f76707}.t2{background:#1c7ed6}.t3{background:#e64980}.t4{background:#7048e8}
  .hint{text-align:center;margin-top:18px;font-size:18px;opacity:.75}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .round-btn{border:none;background:#fff;border-radius:50%;width:56px;height:56px;font-size:28px;cursor:pointer;box-shadow:0 5px 0 #d8d8d8;flex:none}
  .round-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d8d8d8}
  .progress{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
  .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #ffd43b}
  .dot.on{background:#ffd43b}
  .prompt{text-align:center;font-size:clamp(24px,6vw,36px);font-weight:800;margin:12px 0 4px;min-height:1.2em}
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;margin:4px 0 12px;text-align:center}
  .emoji-big{font-size:clamp(80px,22vw,120px);line-height:1}
  .word{font-size:clamp(40px,11vw,64px);font-weight:800;letter-spacing:2px;background:#fff;border-radius:20px;padding:2px 22px;box-shadow:0 5px 0 #e3e3e3}
  .word .gap{color:#ced4da}
  .sum{font-size:clamp(52px,14vw,84px);font-weight:800;line-height:1}
  .helper{font-size:clamp(22px,6vw,32px);line-height:1.2;max-width:100%;word-break:break-all}
  .seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:clamp(40px,11vw,62px);font-weight:800}
  .seq span{background:#fff;border-radius:16px;min-width:1.4em;padding:0 8px;box-shadow:0 4px 0 #e3e3e3;text-align:center}
  .seq .q{background:#ffe066}
  .clock{width:min(58vw,240px);height:min(58vw,240px)}
  .choices{display:grid;gap:14px;margin-top:auto;padding-bottom:12px;grid-template-columns:1fr 1fr}
  .choice{border:none;background:#fff;border-radius:24px;min-height:100px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 0 #d6d6d6;font-family:inherit;font-size:clamp(30px,8.5vw,50px);font-weight:800;color:#2b2d42;padding:10px;transition:transform .1s;line-height:1.1;text-align:center}
  .choice:active{transform:translateY(6px);box-shadow:0 2px 0 #d6d6d6}
  .choice.sm{font-size:clamp(24px,6.5vw,38px)}
  .wiggle{animation:wig .45s}
  @keyframes wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  .right{animation:pop .5s;background:#d3f9d8!important}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .fade{opacity:.35}
  .overlay{position:fixed;inset:0;background:rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;text-align:center;padding:20px}
  .overlay.show{display:flex}
  .overlay .big{font-size:110px;animation:pop 1s infinite}
  .overlay h2{font-size:40px;margin:6px 0}
  .go{border:none;background:#51cf66;color:#fff;font-family:inherit;font-size:28px;font-weight:800;border-radius:999px;padding:10px 36px;margin-top:14px;cursor:pointer;box-shadow:0 7px 0 #2f9e44;min-width:200px}
  .go:active{transform:translateY(5px);box-shadow:0 2px 0 #2f9e44}
  .go.blue{background:#4dabf7;box-shadow:0 7px 0 #1c7ed6}
  .go.red{background:#fa5252;box-shadow:0 7px 0 #c92a2a}
  .reset{display:block;margin:22px auto 0;border:none;background:#fff;font-family:inherit;font-size:18px;font-weight:800;color:#868e96;border-radius:999px;padding:8px 20px;box-shadow:0 4px 0 #dee2e6;cursor:pointer}
  .confetti{position:fixed;top:-40px;font-size:30px;z-index:30;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .hidden{display:none!important}
  .parent{margin-top:auto;padding-top:20px;font-size:15px;opacity:.6;text-align:center}
  .ortu{background:#fff4e6;border:2px dashed #ffa94d;color:#d9480f;border-radius:16px;padding:8px 12px;font-weight:800;font-size:17px;text-align:center;margin:12px 0 0}
  .ortu.small{font-size:14px;padding:3px 10px;margin:8px auto 0;border-width:1.5px}

  .t1{background:#f08c00}.t2{background:#1c7ed6}.t3{background:#d6336c}.t4{background:#2f9e44}
  .pickrow{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .pickrow button{border:none;background:#fff;border-radius:18px;font-size:44px;width:76px;height:76px;cursor:pointer;box-shadow:0 5px 0 #d6d6d6;line-height:1}
  .pickrow button.sel{background:#ffe066;box-shadow:0 5px 0 #f59f00}
  .lbl{text-align:center;font-weight:800;font-size:18px;margin-top:16px}
  .road{position:relative;height:118px;margin:10px 0 4px;border-radius:18px;overflow:hidden;background:linear-gradient(#8ce99a 0 22%,#868e96 22% 78%,#8ce99a 78%)}
  .road .dash{position:absolute;left:0;right:0;top:48%;height:5px;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 34px)}
  .road .fin{position:absolute;right:4px;top:22%;bottom:22%;width:16px;background:repeating-conic-gradient(#212529 0 25%,#fff 0 50%) 0 0/8px 8px}
  .road .tree{position:absolute;top:-2px;font-size:22px}
  .road .st{position:absolute;top:58%;font-size:16px;transform:translateX(-50%);transition:opacity .3s}
  .rider{position:absolute;top:18%;font-size:56px;line-height:1;transition:left .9s cubic-bezier(.3,1.4,.5,1);transform:translateX(-50%)}
  .rider span{display:inline-block;transform:scaleX(-1)}
  .rider.boost span{animation:bump .35s 2}
  @keyframes bump{50%{transform:scaleX(-1) translateY(-10px) rotate(-8deg)}}
  .objs{font-size:clamp(30px,9vw,44px);line-height:1.15;max-width:340px;letter-spacing:2px}
</style>
</head>
<body>
<div class="wrap">

  <section id="menu">
    <a href="index.html" style="display:inline-block;font-weight:800;font-size:18px;color:#495057;text-decoration:none;background:#fff;border-radius:999px;padding:4px 14px;margin-bottom:8px;box-shadow:0 3px 0 #dee2e6">⬅ Pilih umur</a>
    <header>
      <div>
        <span class="badge" style="background:#f08c00">4–9 tahun</span>
        <h1>Balap Sepeda Berhitung 🚲</h1>
      </div>
      <div class="stars">⭐ <span class="starCount">0</span></div>
    </header>
    <div class="ortu">👨‍👩‍👧 Harap didampingi orang tua saat bermain.</div>
    <div class="lbl">1. Pilih kendaraanmu</div>
    <div class="pickrow" id="vehicles">
      <button data-v="🚴" class="sel">🚴</button><button data-v="🚴‍♀️">🚴‍♀️</button><button data-v="🛴">🛴</button><button data-v="🚲">🚲</button>
    </div>
    <div class="lbl">2. Pilih lintasan</div>
    <div class="menu">
      <button class="tile t1" data-game="hitung"><span class="ico">🍎</span>Taman<small>hitung benda 1–10</small></button>
      <button class="tile t2" data-game="tambah"><span class="ico">➕</span>Kota<small>tambah sampai 10</small></button>
      <button class="tile t3" data-game="campur"><span class="ico">⛰️</span>Gunung<small>tambah &amp; kurang 20</small></button>
      <button class="tile t4" data-game="kali"><span class="ico">🚀</span>Super<small>perkalian 1–5</small></button>
    </div>
    <p class="hint">Jawab benar supaya sepedamu maju sampai garis finis! 🏁</p>
    <button class="reset" id="resetBtn">🔄 Reset bintang</button>
  </section>

  <section id="game" class="hidden" style="display:flex;flex-direction:column;flex:1">
    <div class="bar">
      <button class="round-btn" id="homeBtn" aria-label="Kembali">🏠</button>
      <div class="stars">⭐ <span class="starCount">0</span></div>
      <button class="round-btn" id="sayBtn" aria-label="Ulangi suara">🔊</button>
    </div>
    <div class="road" id="road"><div class="dash"></div><div class="fin"></div><div class="rider" id="rider"><span id="riderE">🚴</span></div></div>
    <div class="prompt" id="prompt"></div>
    <div class="stage" id="stage"></div>
    <div class="choices" id="choices" style="grid-template-columns:1fr 1fr 1fr"></div>
  </section>
</div>

<div class="overlay" id="done">
  <div class="big">🏁</div>
  <h2>Sampai Finis!</h2>
  <div style="font-size:24px" id="doneText"></div>
  <button class="go" id="againBtn">Balapan Lagi</button>
  <button class="go blue" id="menuBtn">Menu</button>
</div>

<div class="overlay" id="confirmReset">
  <div style="font-size:80px">🔄</div>
  <h2>Hapus bintang balapan?</h2>
  <div style="font-size:20px">Bintang akan kembali ke 0.</div>
  <button class="go red" id="yesReset">Ya, reset</button>
  <button class="go blue" id="noReset">Batal</button>
</div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let voiceID=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voiceID=vs.find(v=>/^id/i.test(v.lang))||vs.find(v=>/indones/i.test(v.name))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';if(voiceID)u.voice=voiceID;u.rate=0.92;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
let actx=null;
function tone(fs,d=0.12){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;const t=actx.currentTime+i*d;g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+d*1.6);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d*1.7)})}catch(e){}}
const ding=()=>tone([660,880,1175],0.09),oops=()=>tone([300,240],0.15),bell=()=>tone([1568,1318],0.08);
const ANGKA=['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
function terbilang(n){if(n<12)return ANGKA[n];if(n<20)return ANGKA[n-10]+' belas';if(n<100)return ANGKA[Math.floor(n/10)]+' puluh'+(n%10?' '+ANGKA[n%10]:'');return String(n)}

const STAR_KEY='starsSP';
let stars=0;
try{stars=parseInt(localStorage.getItem(STAR_KEY)||'0',10)||0}catch(e){}
function setStars(){document.querySelectorAll('.starCount').forEach(s=>s.textContent=stars);try{localStorage.setItem(STAR_KEY,stars)}catch(e){}}
setStars();
function confetti(){const b=['⭐','🎉','🌟','🎈','🏁','✨'];for(let i=0;i<18;i++){const d=document.createElement('div');d.className='confetti';d.textContent=b[i%b.length];d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.4+Math.random()*1.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}}

let vehicle='🚴';
try{vehicle=localStorage.getItem('spVehicle')||vehicle}catch(e){}
document.querySelectorAll('#vehicles button').forEach(b=>{
  b.classList.toggle('sel',b.dataset.v===vehicle);
  b.onclick=()=>{vehicle=b.dataset.v;try{localStorage.setItem('spVehicle',vehicle)}catch(e){}document.querySelectorAll('#vehicles button').forEach(x=>x.classList.toggle('sel',x===b));bell()};
});

const STEPS=8;const OBJ=['🍎','🍌','⚽','🌸','🐟','🎈','⭐','🍓','🚗','🐤'];
let current=null,step=0,q=null,locked=false,firstTry=true,earned=0;

function placeRider(){$('rider').style.left=(8+step*(80/STEPS))+'%'}
function drawStars(){
  document.querySelectorAll('.road .st').forEach(e=>e.remove());
  for(let i=step+1;i<=STEPS;i++){const s=document.createElement('div');s.className='st';s.textContent='⭐';s.style.left=(8+i*(80/STEPS))+'%';$('road').appendChild(s)}
}
function numOpts(ans){const s=new Set([ans]);let t=0;while(s.size<3&&t<60){const v=ans+rnd(-3,3);if(v>=0)s.add(v);t++}let k=1;while(s.size<3)s.add(ans+k++);return shuffle([...s])}

function makeQ(){
  const hard=step>=STEPS/2;
  if(current==='hitung'){
    const n=rnd(hard?5:1,hard?10:6),o=OBJ[rnd(0,OBJ.length-1)];
    return {prompt:'Ada berapa?',speak:'Ada berapa banyak?',stage:`<div class="objs">${o.repeat(n)}</div>`,ans:n};
  }
  if(current==='tambah'){
    const a=rnd(1,hard?6:4),b=rnd(1,hard?10-a:4);
    return {prompt:'Berapa hasilnya?',speak:terbilang(a)+' tambah '+terbilang(b)+', sama dengan berapa?',stage:`<div class="sum">${a} + ${b}</div>`,ans:a+b};
  }
  if(current==='campur'){
    if(Math.random()<.5){const a=rnd(hard?6:2,hard?12:9),b=rnd(1,20-a>8?8:20-a);return {prompt:'Berapa hasilnya?',speak:terbilang(a)+' tambah '+terbilang(b)+'?',stage:`<div class="sum">${a} + ${b}</div>`,ans:a+b}}
    const a=rnd(hard?11:5,hard?20:12),b=rnd(1,hard?9:a-1);return {prompt:'Berapa hasilnya?',speak:terbilang(a)+' kurang '+terbilang(b)+'?',stage:`<div class="sum">${a} − ${b}</div>`,ans:a-b};
  }
  const a=rnd(1,5),b=rnd(1,hard?10:5);
  return {prompt:'Berapa hasilnya?',speak:terbilang(a)+' kali '+terbilang(b)+'?',stage:`<div class="sum">${a} × ${b}</div>`,ans:a*b};
}
function render(){
  locked=false;firstTry=true;q=makeQ();
  $('prompt').textContent=q.prompt;$('stage').innerHTML=q.stage;
  const ch=$('choices');ch.innerHTML='';
  numOpts(q.ans).forEach(v=>{const b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(b,v===q.ans);ch.appendChild(b)});
  setTimeout(()=>say(q.speak),250);
}
function answer(btn,ok){
  if(locked)return;
  if(ok){
    locked=true;btn.classList.add('right');[...$('choices').children].forEach(c=>{if(c!==btn)c.classList.add('fade')});
    ding();step++;placeRider();drawStars();
    const r=$('rider');r.classList.remove('boost');void r.offsetWidth;r.classList.add('boost');
    if(firstTry){stars++;earned++;setStars()}
    say(['Benar! Ayo maju!','Hebat! Ngebut!','Pintar! Terus kayuh!','Mantap! Hampir sampai!'][rnd(0,3)]);
    setTimeout(()=>{step>=STEPS?finish():render()},1700);
  }else{
    firstTry=false;oops();btn.classList.remove('wiggle');void btn.offsetWidth;btn.classList.add('wiggle');say('Belum tepat, coba lagi!');
  }
}
function startGame(g){current=g;step=0;earned=0;$('riderE').textContent=vehicle;$('menu').classList.add('hidden');$('game').classList.remove('hidden');$('done').classList.remove('show');placeRider();drawStars();render()}
function finish(){
  $('doneText').textContent='Kamu dapat '+earned+' bintang ⭐';
  $('done').classList.add('show');tone([523,659,784,1047,784,1047],0.14);confetti();setTimeout(confetti,600);
  say('Hore! Kamu sampai finis! Dapat '+terbilang(earned)+' bintang!');
}
function goMenu(){try{speechSynthesis.cancel()}catch(e){}$('done').classList.remove('show');$('game').classList.add('hidden');$('menu').classList.remove('hidden')}
document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>startGame(t.dataset.game));
$('homeBtn').onclick=goMenu;
$('sayBtn').onclick=()=>q&&say(q.speak);
$('againBtn').onclick=()=>startGame(current);
$('menuBtn').onclick=goMenu;
$('resetBtn').onclick=()=>$('confirmReset').classList.add('show');
$('noReset').onclick=()=>$('confirmReset').classList.remove('show');
$('yesReset').onclick=()=>{stars=0;setStars();$('confirmReset').classList.remove('show');tone([392,330,262],0.1)};
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})</script>
</body>
</html>
